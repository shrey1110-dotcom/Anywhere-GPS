# Generate the Xcode project with: brew install xcodegen && xcodegen   (or create an iOS App in Xcode and add Sources/)
name: LocationProbe
options: { bundleIdPrefix: dev.anywheregps }
targets:
  LocationProbe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location Probe shows what Core Location reports on this device."
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.anywheregps.locationprobe
